<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PiShelf Admin</title><style>body{font:16px system-ui;max-width:800px;margin:25px auto;padding:0 15px;background:#111923;color:#f5f5f5}input,select,button{font:inherit;padding:10px;margin:6px;border-radius:6px}button{cursor:pointer}section{border:1px solid #647080;padding:16px;border-radius:12px;margin:20px 0}li{margin:10px 0}#error{color:#ff9b95}</style>
<header><a href="/" style="color:#9bd5ff">← Library</a><h1>PiShelf Administration</h1><p>Only administrators can create, disable, reset or delete accounts.</p></header>
<section><h2>Library folders</h2><form id="paths"><label>Magazines <input name="magazines" type="text" autocomplete="off"></label> <label>Newspapers <input name="newspapers" type="text" autocomplete="off"></label> <label>Books <input name="books" type="text" autocomplete="off"></label> <p>Use existing folders visible to PiShelf. Restart PiShelf after saving.</p><label>Folder access PIN <input name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" required></label><button disabled>Save folders</button><output id="paths-status"></output></form></section><section><h2>Create user</h2><form id="create"><input name="username" placeholder="Username" required minlength="3" maxlength="40"><input name="password" type="password" autocomplete="new-password" placeholder="Password (12+ characters)" required minlength="12"><select name="role"><option value="reader">Reader — view only</option><option value="admin">Administrator — full access</option></select><button>Create account</button></form></section>
<section><h2>Users</h2><ul id="users"></ul></section><p id="error" role="alert"></p><script src="/admin.js" defer></script></html>
