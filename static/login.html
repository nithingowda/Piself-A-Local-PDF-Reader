<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PiShelf Sign In</title>
<style>body{font:16px system-ui;background:#10151f;color:#f5f7fa;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(360px,90vw);padding:30px;background:#1b2532;border-radius:18px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #536176;font:inherit}button{background:#83c5ff;color:#10151f;font-weight:700;cursor:pointer}label{display:block;margin-top:12px}#error{color:#ffb4ab;min-height:1.5em}</style>
<main><h1>PiShelf</h1><p>Sign in to your private PDF library.</p>
<form id="login"><label>Username<input id="username" autocomplete="username" required maxlength="40"></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button>Sign in</button></form><p id="error" role="alert"></p></main>
<script src="/login.js" defer></script></html>
