services:
  pishelf:
    build: .
    image: pishelf:local
    restart: unless-stopped
    init: true
    user: "${PISHELF_UID:-1000}:${PISHELF_GID:-1000}"
    ports:
      - "${PISHELF_PORT:-8098}:8080"
    volumes:
      - "${MAGAZINE_DIR:-./magazines}:/magazines"
      - "piself:/data"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  piself:
    external: true
    name: piself
