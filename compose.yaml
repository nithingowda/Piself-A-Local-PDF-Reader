services:
  pishelf:
    build: .
    image: pishelf:local
    restart: unless-stopped
    init: true
    user: "0:0"
    environment:
      PISHELF_UID: "${PISHELF_UID:-1000}"
      PISHELF_GID: "${PISHELF_GID:-1000}"
    ports:
      - "${PISHELF_PORT:-8098}:8080"
    volumes:
      - "/mnt/Nithin-Nas/nextcloud/data/nithingowda/files/Magazines/:/magazines"
      - "piself:/data"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  piself:
    name: piself
