# PiShelf container settings and persistent library mounts.
services:
  pishelf:
    build: .
    image: pishelf:local
    command: ["python", "server.py", "--library", "/magazines", "--newspapers", "/newspapers", "--books", "/books", "--data", "/data"]
    restart: unless-stopped
    init: true
    user: "0:0"
    environment:
      PISHELF_UID: "${PISHELF_UID:-1000}"
      PISHELF_GID: "${PISHELF_GID:-1000}"
      PISHELF_COOKIE_SECURE: "${PISHELF_COOKIE_SECURE:-0}"
    ports:
      - "${PISHELF_PORT:-8098}:8080"
    volumes:
      - type: bind
        source: "${MAGAZINE_DIR:-/mnt/Nithin-Nas/nextcloud/data/nithingowda/files/Magazines}"
        target: /magazines
        bind:
          create_host_path: false
      - type: bind
        source: "${NEWSPAPER_DIR:-/mnt/Nithin-Nas/nextcloud/data/nithingowda/files/NewsPapers}"
        target: /newspapers
        bind:
          create_host_path: false
      - type: bind
        source: "${BOOK_DIR:-/mnt/Nithin-Nas/nextcloud/data/nithingowda/files/Books}"
        target: /books
        bind:
          create_host_path: false
      - "piself:/data"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge

volumes:
  piself:
    name: piself
