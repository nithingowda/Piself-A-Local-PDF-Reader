name: Authentication checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and authentication regression checks
        run: |
          python -m compileall -q server.py auth.py docker-entrypoint.py
          python -m unittest discover -s tests -p 'test_authentication_source.py' -v
