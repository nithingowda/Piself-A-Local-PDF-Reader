name: Security checks
on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python and run security regression tests
        run: |
          python -m compileall -q server.py docker-entrypoint.py
          python -m unittest discover -s tests -p 'test_security_hardening_source.py' -v
      - name: Scan dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -r requirements.txt
          python -m pip_audit --strict
