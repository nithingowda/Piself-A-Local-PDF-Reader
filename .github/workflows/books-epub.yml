name: Books and EPUB checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  books-epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python and browser JavaScript syntax
        run: |
          python -m compileall -q server.py auth.py
          node --check static/app.js
          node --check static/epub-reader.js
      - name: Run Books/EPUB API and UI regression tests
        run: |
          python -m unittest discover -s tests -p 'test_books_epub*.py' -v
  scan-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production OCR runtime
        run: docker build -t pishelf-ocr-test .
      - name: Verify searchable text in a mixed PDF
        run: docker run --rm --entrypoint python -v "$PWD/tests:/tests:ro" pishelf-ocr-test -m unittest discover -s /tests -p test_scan_ocr.py -v
