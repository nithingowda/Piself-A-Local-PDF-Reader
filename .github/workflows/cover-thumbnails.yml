name: Cover thumbnail checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image/PDF dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax checks
        run: |
          python -m compileall -q server.py epub_covers.py auth.py
          node --check static/app.js
      - name: Run thumbnail HTTP integration and source regression tests
        run: python -m unittest discover -s tests -p 'test_cover_thumbnails*.py' -v
