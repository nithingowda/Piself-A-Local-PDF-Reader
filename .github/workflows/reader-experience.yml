name: Reader experience checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Zoom geometry and touch interaction tests
        run: node --test tests/test_zoom_center.mjs
      - name: Two-page book spread logic
        run: node --test tests/test_book_spread.mjs
      - name: Book fit and swipe interaction tests
        run: node --test tests/test_book_fit_swipe.mjs
      - name: Decoded WebP preloading and instant page navigation tests
        run: node --test tests/test_predecoded_page_turn.mjs
      - name: Book spread size stability tests
        run: node --test tests/test_spread_size_stability.mjs
      - name: Book spread source checks
        run: python -m unittest discover -s tests -p 'test_book_spread_source.py' -v
      - name: Reader regression tests
        run: python -m unittest discover -s tests -p 'test_reader_experience_source.py' -v
